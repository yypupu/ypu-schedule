<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>予定を登録｜Y-PU スケジュール</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --text:#1d1f23; --sub:#6b7280; --line:#e5e7eb;
    --accent:#1f2937; --chip:#eef0f3; --input:#f7f8fa; --red:#e0413a; --green:#06c755;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111317; --surface:#1b1e24; --text:#eef0f3; --sub:#9aa1ab; --line:#2a2e36;
      --accent:#eef0f3; --chip:#252932; --input:#23272f; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 40px}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  .screen{display:none}.screen.on{display:block}
  h1{font-size:20px;margin:4px 2px 14px}
  .center{text-align:center;color:var(--sub);padding:60px 0;font-weight:700;line-height:1.8}

  .who{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .who img,.who .ic{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
  .who small{display:block;color:var(--sub);font-size:11px}
  .who b{font-size:15px}

  .field{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:10px}
  .field label{display:block;font-size:13px;font-weight:800;margin-bottom:8px}
  .field label em{font-style:normal;font-size:10px;color:#fff;background:var(--red);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
  .field label i{font-style:normal;font-size:10px;color:var(--sub);background:var(--chip);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
  .inp{width:100%;border:1.5px solid var(--line);background:var(--input);border-radius:10px;padding:11px 12px;font-size:16px}
  .inp:focus{outline:none;border-color:var(--green)}
  textarea.inp{min-height:70px;resize:vertical}
  .times{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
  .times span{color:var(--sub);font-weight:700}
  .genres{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .gbtn{border:2px solid var(--line);background:var(--input);border-radius:10px;padding:12px 6px;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .gbtn .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .gbtn.on{color:#fff}
  .people{display:flex;flex-wrap:wrap;gap:6px}
  .pbtn{border:1.5px solid var(--line);background:var(--input);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .pbtn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .submit{width:100%;border:0;background:var(--green);color:#fff;font-size:16px;font-weight:800;padding:16px;border-radius:14px;cursor:pointer;margin-top:6px}
  .submit:disabled{opacity:.5}
  .sub2{width:100%;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:800;padding:14px;border-radius:14px;cursor:pointer;margin-top:8px}
  .err{color:var(--red);font-size:13px;font-weight:700;text-align:center;min-height:20px;margin-top:8px;white-space:pre-wrap}
  .hint{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:12px}


  /* 日程・繰り返し */
  .adrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:14px;font-weight:700}
  .sw{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
  .sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .sw.on{background:var(--green)}.sw.on i{left:23px}
  .dt{display:grid;grid-template-columns:44px minmax(0,1fr) 104px;gap:8px;align-items:center;margin-top:8px}
  .dt .dl{font-size:12px;font-weight:800;color:var(--sub)}
  .dt .inp{min-width:0;width:100%;-webkit-appearance:none;appearance:none;padding:11px 8px;text-align:left}
  .dt input::-webkit-date-and-time-value{text-align:left}
  .allday .dt{grid-template-columns:44px minmax(0,1fr)}
  .allday .tm{display:none}
  #untilBox .dt{grid-template-columns:64px minmax(0,1fr)}
  .reps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .reps button{border:2px solid var(--line);background:var(--input);border-radius:10px;padding:10px 0;font-size:14px;font-weight:800;cursor:pointer}
  .reps button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .rpv{margin-top:10px;font-size:13px;font-weight:800;color:var(--green)}
  .rpv.bad{color:var(--red)}
  /* タブ・マイ予定 */
  .ltabs{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:14px;position:sticky;top:8px;z-index:5}
  .ltabs button{border:0;background:transparent;color:var(--sub);font-size:15px;font-weight:800;padding:10px 0;border-radius:9px;cursor:pointer}
  .ltabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .sh{font-size:14px;font-weight:800;margin:16px 2px 8px}
  .mc{display:flex;background:var(--surface);border-radius:14px;margin-bottom:8px;overflow:hidden}
  .mc .bar{width:6px;flex:none}
  .mc .bd{padding:12px 14px;flex:1;min-width:0}
  .mc .tm{font-size:13px;font-weight:800}
  .mc .tt{font-size:16px;font-weight:800;margin-top:2px;word-break:break-all}
  .mc .mt{font-size:12px;color:var(--sub);margin-top:4px}
  .mc .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .sb{border:1.5px solid var(--line);background:var(--input);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer}
  .sb.yes{border-color:var(--green);background:var(--green);color:#fff}
  .sb.no,.sb.del{border-color:var(--red);color:var(--red)}
  .sb.no.on{background:var(--red);color:#fff}
  .empty{font-size:13px;color:var(--sub);background:var(--surface);border-radius:14px;padding:14px;opacity:.8}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.on{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .sheet h3{font-size:16px;margin-bottom:12px;text-align:center}
  .sheet button{display:block;width:100%;border:0;background:var(--chip);border-radius:12px;padding:14px;font-size:15px;font-weight:800;margin-top:8px;cursor:pointer}
  .sheet button.danger{background:var(--red);color:#fff}
  .done{background:var(--surface);border-radius:16px;padding:22px 18px;text-align:center}
  .done .big{font-size:40px}
  .done h2{font-size:19px;margin:6px 0 14px}
  .card{text-align:left;border-left:6px solid var(--green);background:var(--input);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.7}
  .card b{font-size:16px}
  .warn{margin-top:10px;font-size:12px;color:var(--red);font-weight:700}
</style>
</head>
<body>

<!-- 読み込み中 -->
<section class="screen on" id="s-load"><div class="center" id="loadMsg">読み込み中…</div></section>

<div class="ltabs" id="ltabs" style="display:none">
  <button data-t="form" class="on">＋ 予定を登録</button>
  <button data-t="mine">📋 マイ予定</button>
</div>

<!-- 初回：あなたはだれ？ -->
<section class="screen" id="s-link">
  <h1>はじめに</h1>
  <div class="who"><img id="pic1" alt=""><div><small>LINEアカウント</small><b id="lineName1"></b></div></div>
  <p class="hint">このLINEアカウントが誰なのかを1回だけ登録します。<br>次回からは自動で「登録者」に入ります。</p>
  <div class="field">
    <label>あなたの名前<em>必須</em></label>
    <select class="inp" id="linkSel"></select>
  </div>
  <button class="submit" id="linkBtn">この名前で登録する</button>
  <div class="err" id="linkErr"></div>
</section>

<!-- 予定を登録 -->
<section class="screen" id="s-form">
  <h1 id="formTitle">予定を登録</h1>
  <div class="who"><img id="pic2" alt=""><div><small>登録者（LINEから自動）</small><b id="meName"></b></div></div>

  <div class="field" id="schedField">
    <label>日程<em>必須</em></label>
    <div class="adrow"><span>終日</span><button type="button" class="sw" id="fAllDay" aria-label="終日"><i></i></button></div>
    <div class="dt"><span class="dl">開始</span><input type="date" class="inp" id="fDate"><input type="time" class="inp tm" id="fStart" value="14:00" step="900"></div>
    <div class="dt"><span class="dl">終了</span><input type="date" class="inp" id="fEndDate"><input type="time" class="inp tm" id="fEnd" value="15:00" step="900"></div>
  </div>
  <div class="field" id="repField">
    <label>繰り返し<i>任意</i></label>
    <div class="reps" id="fRepeat">
      <button type="button" data-r="none" class="on">なし</button>
      <button type="button" data-r="weekly">毎週</button>
      <button type="button" data-r="biweekly">隔週</button>
      <button type="button" data-r="monthly">毎月</button>
    </div>
    <div id="untilBox" style="display:none">
      <div class="dt"><span class="dl">いつまで</span><input type="date" class="inp" id="fUntil"></div>
      <div class="rpv" id="repPrev"></div>
    </div>
  </div>
  <div class="field">
    <label>タイトル<em>必須</em></label>
    <input type="text" class="inp" id="fTitle" placeholder="例）YPプロジェクト 定例MTG">
  </div>
  <div class="field">
    <label>チーム<em>必須</em></label>
    <select class="inp" id="fTeam"></select>
  </div>
  <div class="field">
    <label>ジャンル<em>必須</em></label>
    <div class="genres" id="fGenre"></div>
  </div>
  <div class="field">
    <label>担当者<i>複数選べます・カレンダーに入ります</i></label>
    <div class="people" id="fPeople"></div>
  </div>
  <div class="field">
    <label>場所<i>任意</i></label>
    <input type="text" class="inp" id="fPlace" placeholder="例）本社／Zoom">
  </div>
  <div class="field">
    <label>URL・資料リンク<i>任意</i></label>
    <input type="url" class="inp" id="fUrl" placeholder="https://〜（企画書・Zoom・地図など）">
  </div>
  <div class="field">
    <label>メモ<i>任意</i></label>
    <textarea class="inp" id="fMemo" placeholder="持ち物・集合時間など"></textarea>
  </div>
  <button class="submit" id="fSubmit">登録する</button>
  <div class="err" id="fErr"></div>
</section>

<!-- マイ予定 -->
<section class="screen" id="s-mine">
  <h1>マイ予定</h1>
  <div class="sh">🙋 担当になっている予定（出欠を返してください）</div>
  <div id="assignedList"></div>
  <div class="sh">✏️ 自分が登録した予定（変更・削除できます）</div>
  <div id="mineList"></div>
</section>

<!-- 登録完了 -->
<section class="screen" id="s-done">
  <div class="done">
    <div class="big">✅</div>
    <h2 id="doneTitle">登録しました</h2>
    <div class="card" id="doneCard"></div>
    <div class="warn" id="doneWarn"></div>
  </div>
  <button class="submit" id="againBtn">続けて登録する</button>
  <button class="sub2" id="listBtn">📅 予定一覧を見る</button>
  <button class="sub2" id="closeBtn">閉じる</button>
</section>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
// ===== 設定 =====
const LIFF_ID = "2011735296-uZ9FRGYG";
const GAS_URL = "https://script.google.com/macros/s/AKfycbxSuKQhWmRD2OrDCrPli2B263rJyBXfyZTuePz6pThy1iIsw2nmMOmPZhNHf_QWdARrpg/exec";

// ===== 共通 =====
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const W=["日","月","火","水","木","金","土"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function show(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id==="s-"+name));
  const tabbed=name==="form"||name==="mine";
  $("ltabs").style.display=tabbed?"":"none";
  document.querySelectorAll("#ltabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===name));
  window.scrollTo(0,0);
}
function fail(msg){$("loadMsg").innerHTML="⚠️ "+esc(msg);show("load");}

let DATA=null, PROFILE=null, fGenre=null, fPeople=new Set();

// ===== 日程（終日・複数日）と繰り返し =====
const MAX_REPEAT=52;
let fAllDay=false, fRepeat="none", endTouched=false;
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const hhmm=d=>`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
const parseYmd=s=>{const[Y,M,D]=s.split("-").map(Number);return new Date(Y,M-1,D);};
const WD=["日","月","火","水","木","金","土"];
const REP_LABEL={weekly:"毎週",biweekly:"隔週",monthly:"毎月"};
function schedDefaults(){
  const t=new Date();t.setDate(t.getDate()+1);
  if(!$("fDate").value) $("fDate").value=ymd(t);
  if(!$("fEndDate").value) $("fEndDate").value=$("fDate").value;
}
function repDates(){
  const ds=$("fDate").value; if(!ds) return [];
  const first=parseYmd(ds); if(fRepeat==="none") return [first];
  const us=$("fUntil").value; if(!us) return [first];
  const until=parseYmd(us), out=[];
  if(fRepeat==="monthly"){
    const D=first.getDate();
    for(let k=0;out.length<=MAX_REPEAT;k++){
      const y=first.getFullYear(),m=first.getMonth()+k,dim=new Date(y,m+1,0).getDate();
      const d=new Date(y,m,Math.min(D,dim)); if(d>until) break; out.push(d);
    }
  }else{
    const step=fRepeat==="weekly"?7:14;
    for(let d=new Date(first);d<=until&&out.length<=MAX_REPEAT;d.setDate(d.getDate()+step)) out.push(new Date(d));
  }
  return out;
}
function repPreview(){
  const el=$("repPrev"); if(fRepeat==="none"){el.textContent="";return;}
  const list=repDates(); if(!$("fUntil").value||!list.length){el.textContent="";return;}
  const last=list[list.length-1], over=list.length>MAX_REPEAT;
  const when=fRepeat==="monthly"?`毎月${list[0].getDate()}日`:`${REP_LABEL[fRepeat]}${WD[list[0].getDay()]}曜`;
  el.classList.toggle("bad",over);
  el.textContent=over?`⚠️ 最大${MAX_REPEAT}回までです。「いつまで」を短くしてください`
    :`🔁 ${when}・全${list.length}回（最終 ${last.getMonth()+1}/${last.getDate()}）`;
}
function setAllDay(on){fAllDay=on;$("fAllDay").classList.toggle("on",on);$("schedField").classList.toggle("allday",on);}
function setRepeat(r){
  fRepeat=r;
  $("fRepeat").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.r===r));
  $("untilBox").style.display=r==="none"?"none":"";
  if(r!=="none"&&!$("fUntil").value&&$("fDate").value){const u=parseYmd($("fDate").value);u.setMonth(u.getMonth()+3);$("fUntil").value=ymd(u);}
  repPreview();
}
function schedInit(){
  schedDefaults();
  $("fAllDay").onclick=()=>setAllDay(!fAllDay);
  $("fDate").addEventListener("change",()=>{
    if(!endTouched||!$("fEndDate").value||$("fEndDate").value<$("fDate").value) $("fEndDate").value=$("fDate").value;
    repPreview();
  });
  $("fEndDate").addEventListener("change",()=>{endTouched=true;});
  $("fRepeat").querySelectorAll("button").forEach(b=>b.onclick=()=>setRepeat(b.dataset.r));
  $("fUntil").addEventListener("change",repPreview);
}
function schedValues(){
  const date=$("fDate").value;
  return {date,endDate:$("fEndDate").value||date,start:$("fStart").value,end:$("fEnd").value,
    allDay:fAllDay,repeat:fRepeat,until:fRepeat==="none"?"":$("fUntil").value};
}
function schedCheck(f){
  if(!f.date) return "「日程」を入力してください";
  if(f.endDate<f.date) return "終了日は開始日と同じか、後の日にしてください";
  if(!f.allDay){
    if(!f.start||!f.end) return "時間を入力してください";
    if(f.endDate===f.date&&f.end<=f.start) return "終了時間は開始時間より後にしてください";
  }
  if(f.repeat!=="none"){
    if(!f.until) return "繰り返しの「いつまで」を入力してください";
    if(f.until<f.date) return "「いつまで」は開始日より後にしてください";
    if(repDates().length>MAX_REPEAT) return `繰り返しは最大${MAX_REPEAT}回までです`;
  }
  return "";
}
function schedReset(){
  endTouched=false;setAllDay(false);$("fUntil").value="";setRepeat("none");
  $("fEndDate").value=$("fDate").value;
}
// 予定の日時をフォームに入れる（変更・コピー用）
function schedFill(e){
  const s=new Date(e.start),en=new Date(e.end);
  $("fDate").value=ymd(s);
  if(e.allDay){$("fEndDate").value=ymd(new Date(en.getTime()-1));}
  else{$("fEndDate").value=ymd(en);$("fStart").value=hhmm(s);$("fEnd").value=hhmm(en);}
  endTouched=$("fEndDate").value!==$("fDate").value;
  setAllDay(!!e.allDay);$("fUntil").value="";setRepeat("none");
}
// 変更のときは繰り返しの欄を隠す
function schedEditMode(on){$("repField").style.display=on?"none":"";}
// 表示用：「14:00〜15:00」「終日」「10/5〜10/7 終日」など
function schedLabel(f){
  const s=parseYmd(f.date),e=parseYmd(f.endDate||f.date),md=d=>`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
  const multi=f.endDate&&f.endDate!==f.date;
  if(f.allDay) return multi?`${md(s)}〜${md(e)} 終日`:`${md(s)} 終日`;
  return multi?`${md(s)} ${f.start}〜${md(e)} ${f.end}`:`${md(s)} ${f.start}〜${f.end}`;
}

schedInit();

// Apps Script に送る（本人確認用のIDトークンを毎回付ける）
async function api(action,extra){
  const idToken=liff.getIDToken();
  const res=await fetch(GAS_URL,{method:"POST",body:JSON.stringify({action,idToken,...(extra||{})})});
  const j=await res.json();
  if(!j.ok) throw new Error(j.error||"エラーが発生しました");
  return j.data;
}

function setPic(){
  ["pic1","pic2"].forEach(id=>{
    const img=$(id);
    if(PROFILE&&PROFILE.pictureUrl){img.src=PROFILE.pictureUrl;}
    else{const d=document.createElement("div");d.className="ic";d.textContent=(DATA?.me?.name||PROFILE?.displayName||"？").slice(0,1);img.replaceWith(d);}
  });
}

// ===== 初回：名前の紐づけ =====
function renderLink(){
  $("lineName1").textContent=PROFILE?.displayName||DATA.lineName||"";
  $("linkSel").innerHTML=`<option value="">選んでください</option>`+
    DATA.people.map(p=>`<option value="${esc(p.id)}" ${p.linked?"disabled":""}>${esc(p.name)}${p.linked?"（登録済み）":""}</option>`).join("");
  show("link");
}
$("linkBtn").onclick=async()=>{
  const id=$("linkSel").value;
  if(!id){$("linkErr").textContent="名前を選んでください";return;}
  $("linkBtn").disabled=true;$("linkErr").textContent="";
  try{DATA=await api("link",{personId:id});openForm(null,"new");}
  catch(e){$("linkErr").textContent="⚠️ "+e.message;}
  finally{$("linkBtn").disabled=false;}
};

// ===== 予定フォーム =====
let EDIT=null;   // 変更中：{ id, scope }
// mode = "new"（新規）／"copy"（コピーして新規）／"edit"（変更）
function openForm(ev,mode,scope){
  EDIT=mode==="edit"?{id:ev.id,scope:scope||"one"}:null;
  $("formTitle").textContent=mode==="edit"?(scope==="after"?"予定を変更（この日以降すべて）":"予定を変更"):mode==="copy"?"コピーして登録":"予定を登録";
  $("fSubmit").textContent=mode==="edit"?"変更する":"登録する";
  $("fErr").textContent="";
  schedEditMode(mode==="edit");
  if(ev){
    $("fTitle").value=ev.title;$("fPlace").value=ev.place||"";$("fMemo").value=ev.memo||"";$("fUrl").value=ev.url||"";
    fGenre=ev.cat;fPeople=new Set(ev.people);schedFill(ev);
  }else if(mode==="new"){
    $("fTitle").value="";$("fPlace").value="";$("fMemo").value="";$("fUrl").value="";fGenre=null;fPeople=new Set();schedReset();
  }
  renderForm();
  if(ev&&[...$("fTeam").options].some(o=>o.value===ev.team)) $("fTeam").value=ev.team;
}
function renderForm(){
  $("meName").textContent=DATA.me.name;
  schedDefaults();
  const cur=$("fTeam").value;
  $("fTeam").innerHTML=`<option value="">選んでください</option>`+DATA.teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
  if([...$("fTeam").options].some(o=>o.value===cur)) $("fTeam").value=cur;
  renderGenres();renderPeople();show("form");
}
function renderGenres(){
  $("fGenre").innerHTML=DATA.genres.map(g=>{const on=fGenre===g.key;
    return `<button class="gbtn ${on?"on":""}" data-k="${esc(g.key)}" style="${on?`background:${esc(g.color)};border-color:${esc(g.color)}`:""}">
      <span class="dot" style="background:${on?"#fff":esc(g.color)}"></span>${esc(g.label)}</button>`;}).join("");
  $("fGenre").querySelectorAll(".gbtn").forEach(b=>b.onclick=()=>{fGenre=b.dataset.k;renderGenres();});
}
function renderPeople(){
  $("fPeople").innerHTML=DATA.people.map(p=>`<button class="pbtn ${fPeople.has(p.id)?"on":""}" data-id="${esc(p.id)}">${esc(p.name)}</button>`).join("");
  $("fPeople").querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{const id=b.dataset.id;fPeople.has(id)?fPeople.delete(id):fPeople.add(id);renderPeople();});
}
$("fSubmit").onclick=async()=>{
  const f={...schedValues(),title:$("fTitle").value.trim(),
    team:$("fTeam").value,cat:fGenre,people:[...fPeople],place:$("fPlace").value.trim(),memo:$("fMemo").value.trim(),
    url:$("fUrl").value.trim()};
  if(f.url&&!/^https?:\/\//i.test(f.url)){$("fErr").textContent="URLは http:// か https:// から入力してください";return;}
  const miss=[!f.title&&"タイトル",!f.team&&"チーム",!f.cat&&"ジャンル"].filter(Boolean);
  if(miss.length){$("fErr").textContent=`「${miss.join("」「")}」を入力してください`;return;}
  const sErr=schedCheck(f); if(sErr){$("fErr").textContent=sErr;return;}
  const editing=EDIT;
  $("fErr").textContent="";$("fSubmit").disabled=true;$("fSubmit").textContent=editing?"変更中…":"登録中…";
  try{
    const r=editing?await api("update",{id:editing.id,form:f,scope:editing.scope}):await api("save",{form:f});
    EDIT=null;
    $("doneTitle").textContent=editing?"変更しました":"登録しました";
    const g=DATA.genres.find(x=>x.key===f.cat)||{label:"",color:"#06c755"};
    const team=DATA.teams.find(t=>t.id===f.team)?.name||"";
    const ppl=f.people.map(id=>DATA.people.find(p=>p.id===id)?.name).filter(Boolean);
    $("doneCard").style.borderLeftColor=g.color;
    const rep=!editing&&f.repeat!=="none"?`<br>🔁 ${REP_LABEL[f.repeat]}・全${r.count}回（〜${esc(f.until.replace(/^\d+-0?(\d+)-0?(\d+)$/,"$1/$2"))}）`
      :editing&&r.count>1?`<br>🔁 この日以降 ${r.count}件を変更`:"";
    $("doneCard").innerHTML=`📅 ${esc(schedLabel(f))}${rep}<br><b>${esc(f.title)}</b><br>
      🏷️ ${esc(g.label)}　👥 ${esc(team)}${f.place?`<br>📍 ${esc(f.place)}`:""}${ppl.length?`<br>👤 ${esc(ppl.join("・"))}`:""}${f.url?`<br>🔗 ${esc(f.url)}`:""}`;
    $("doneWarn").textContent=r&&r.warn?("⚠️ "+r.warn):"";

    // 開いたトーク（公式アカウントとのトーク／グループ）に登録内容を送る（通数はかからない）
    try{
      const ctx=liff.getContext();
      if(ctx&&["utou","group","room","square_chat"].includes(ctx.type)){
        const lines=[editing?"✏️ 予定を変更しました":"📅 予定を登録しました","",schedLabel(f)];
        if(!editing&&f.repeat!=="none") lines.push(`🔁 ${REP_LABEL[f.repeat]}・全${r.count}回`);
        if(editing&&r.count>1) lines.push(`🔁 この日以降 ${r.count}件`);
        lines.push(`【${g.label}】${f.title}`,`👥 ${team}`);
        if(f.place) lines.push(`📍 ${f.place}`);
        if(ppl.length) lines.push(`👤 ${ppl.join("・")}`);
        if(f.url) lines.push(`🔗 ${f.url}`);
        await liff.sendMessages([{type:"text",text:lines.join("\n")}]);
      }
    }catch(e){ /* トークの外で開いたときなどは送らない */ }
    $("fTitle").value="";$("fPlace").value="";$("fMemo").value="";$("fUrl").value="";fGenre=null;fPeople=new Set();schedReset();
    show("done");
  }catch(e){$("fErr").textContent="⚠️ "+e.message;}
  finally{$("fSubmit").disabled=false;$("fSubmit").textContent=EDIT?"変更する":"登録する";}
};
$("againBtn").onclick=()=>openForm(null,"new");

// ===== タブ =====
document.querySelectorAll("#ltabs button").forEach(b=>b.onclick=()=>b.dataset.t==="mine"?loadMine():openForm(null,"new"));

// ===== マイ予定 =====
let MINE={assigned:[],mine:[]};
function choose(title,options){
  return new Promise(res=>{
    $("sheet").innerHTML=`<h3>${esc(title)}</h3>`+options.map((o,i)=>`<button data-i="${i}" class="${o.danger?"danger":""}">${esc(o.label)}</button>`).join("")+`<button data-i="-1">キャンセル</button>`;
    $("modal").classList.add("on");
    const close=v=>{$("modal").classList.remove("on");res(v);};
    $("sheet").querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;close(i<0?null:options[i].value);});
    $("modal").onclick=ev=>{if(ev.target===$("modal"))close(null);};
  });
}
function evLabel(e){
  const s=new Date(e.start),en=new Date(e.end),md=d=>`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
  if(e.allDay){const last=new Date(en.getTime()-1);return ymd(s)===ymd(last)?`${md(s)} 終日`:`${md(s)}〜${md(last)} 終日`;}
  return ymd(s)===ymd(en)?`${md(s)} ${hhmm(s)}〜${hhmm(en)}`:`${md(s)} ${hhmm(s)}〜${md(en)} ${hhmm(en)}`;
}
function mcard(e,kind){
  const g=DATA.genres.find(x=>x.key===e.cat)||{label:e.cat,color:"#9aa1ab"};
  const team=DATA.teams.find(t=>t.id===e.team)?.name||"";
  const my=(e.rsvp||{})[DATA.me.id];
  const acts=kind==="assigned"
    ?`<button class="sb ${my==="yes"?"yes":""}" data-rsvp="${esc(e.id)}" data-v="yes">⭕ 行ける</button><button class="sb no ${my==="no"?"on":""}" data-rsvp="${esc(e.id)}" data-v="no">❌ 行けない</button>`
    :`<button class="sb" data-edit="${esc(e.id)}">✏️ 変更</button><button class="sb" data-copy="${esc(e.id)}">📋 コピー</button><button class="sb del" data-del="${esc(e.id)}">削除</button>`;
  return `<div class="mc"><div class="bar" style="background:${esc(g.color)}"></div><div class="bd">
    <div class="tm">${esc(evLabel(e))}${e.series?" 🔁":""}</div>
    <div class="tt">${esc(e.title)}</div>
    <div class="mt">🏷️ ${esc(g.label)}　👥 ${esc(team)}${e.place?`　📍 ${esc(e.place)}`:""}</div>
    <div class="ac">${acts}</div></div></div>`;
}
function renderMine(){
  $("assignedList").innerHTML=MINE.assigned.length?MINE.assigned.map(e=>mcard(e,"assigned")).join(""):`<div class="empty">担当になっている予定はありません</div>`;
  $("mineList").innerHTML=MINE.mine.length?MINE.mine.map(e=>mcard(e,"mine")).join(""):`<div class="empty">登録した予定はありません</div>`;
  const find=id=>MINE.mine.find(x=>x.id===id)||MINE.assigned.find(x=>x.id===id);
  document.querySelectorAll("[data-rsvp]").forEach(b=>b.onclick=async()=>{
    const e=find(b.dataset.rsvp); const v=(e.rsvp||{})[DATA.me.id]===b.dataset.v?"":b.dataset.v;
    b.disabled=true;
    try{const r=await api("rsvp",{id:e.id,value:v});e.rsvp=r.rsvp;MINE.mine.concat(MINE.assigned).filter(x=>x.id===e.id).forEach(x=>x.rsvp=r.rsvp);renderMine();}
    catch(err){alert(err.message);}
  });
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>openForm(find(b.dataset.copy),"copy"));
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=async()=>{
    const e=find(b.dataset.edit);
    const scope=e.series?await choose(`「${e.title}」は繰り返しの予定です`,[{label:"この日だけ変更",value:"one"},{label:"この日以降をすべて変更",value:"after"}]):"one";
    if(scope) openForm(e,"edit",scope);
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const e=find(b.dataset.del);
    const scope=e.series
      ?await choose(`「${e.title}」は繰り返しの予定です`,[{label:"この日だけ削除",value:"one",danger:true},{label:"この日以降をすべて削除",value:"after",danger:true}])
      :await choose(`「${e.title}」を削除しますか？`,[{label:"削除する",value:"one",danger:true}]);
    if(!scope)return;
    b.disabled=true;b.textContent="削除中…";
    try{await api("delete",{id:e.id,scope});await loadMine();}
    catch(err){alert(err.message);b.disabled=false;b.textContent="削除";}
  });
}
async function loadMine(){
  show("mine");
  $("assignedList").innerHTML=$("mineList").innerHTML=`<div class="empty">読み込み中…</div>`;
  try{MINE=await api("mine");renderMine();}
  catch(e){$("assignedList").innerHTML=`<div class="empty">⚠️ ${esc(e.message)}</div>`;$("mineList").innerHTML="";}
}
$("listBtn").onclick=()=>{ try{liff.openWindow({url:GAS_URL,external:false});}catch(e){location.href=GAS_URL;} };
$("closeBtn").onclick=()=>{ try{liff.closeWindow();}catch(e){} };

// ===== 起動 =====
(async()=>{
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
    try{PROFILE=await liff.getProfile();}catch(e){}
    DATA=await api("init");
    setPic();
    if(!DATA.me) renderLink();
    else if(new URLSearchParams(location.search).get("tab")==="mine") loadMine();   // ?tab=mine でマイ予定から開く
    else openForm(null,"new");
  }catch(e){
    fail((e&&e.message)||"読み込みに失敗しました。LINEアプリから開き直してください");
  }
})();
</script>
